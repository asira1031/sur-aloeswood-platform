name: Quality and TOH safety

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run TOH and security contract tests
        run: npm run toh:test

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
